<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>IEJB Hub</title>
    <meta name="description" content="Escalas e repertório dos ministérios da IEJB.">
    <!-- App privado: não queremos ele no Google -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#8F0D0B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="IEJB Hub">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" href="/icone-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
    <link rel="preload" href="/logo-chama.png" as="image">
    <style>
        /* Abertura (D51). Aqui dentro e não no CSS do app: precisa aparecer
           antes de qualquer arquivo carregar. Só transform/opacity/filter
           curtos: roda liso até em celular simples. */
        #abertura {
            position: fixed; inset: 0; z-index: 1000;
            display: grid; place-items: center;
            background: radial-gradient(120% 80% at 50% 38%, #a3110e, #8F0D0B 45%, #5a0807);
            transition: opacity .5s cubic-bezier(.32,.72,0,1);
        }
        #abertura.saindo { opacity: 0; pointer-events: none; }
        .ab-logo { display: grid; justify-items: center; gap: 14px; transition: transform .6s cubic-bezier(.32,.72,0,1); }
        #abertura.saindo .ab-logo { transform: scale(1.12); }
        .ab-chama {
            width: 54px; height: auto;
            transform-origin: 50% 100%;
            animation: ab-chama .9s .78s cubic-bezier(.34,1.56,.64,1) backwards,
                       ab-tremer 1.1s 1.6s ease-in-out 2 alternate;
        }
        .ab-cruz {
            position: relative;
            display: grid; grid-template-columns: repeat(2, 46px); grid-template-rows: repeat(2, 58px);
            place-items: center;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-size: 44px; line-height: 1; color: #fff;
            perspective: 400px;
        }
        .ab-linha { position: absolute; background: #fff; border-radius: 1px; }
        /* Linhas duplas, como na logo */
        .ab-v { left: 50%; top: -14px; bottom: -14px; width: 6px; margin-left: -3px;
                background: linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px 4.5px, #fff 4.5px);
                transform-origin: 50% 50%; animation: ab-v .55s .12s cubic-bezier(.32,.72,0,1) backwards; }
        .ab-h { top: 50%; left: -14px; right: -14px; height: 6px; margin-top: -3px;
                background: linear-gradient(180deg, #fff 0 1.5px, transparent 1.5px 4.5px, #fff 4.5px);
                animation: ab-h .55s .26s cubic-bezier(.32,.72,0,1) backwards; }
        .ab-letra {
            display: block;
            animation: ab-letra .8s calc(.42s + var(--n) * .1s) cubic-bezier(.34,1.56,.64,1) backwards;
        }
        @keyframes ab-v { from { transform: scaleY(0); } }
        @keyframes ab-h { from { transform: scaleX(0); } }
        @keyframes ab-letra {
            from { opacity: 0; transform: rotateY(-100deg) translateY(10px) scale(.7); filter: blur(6px); }
            60% { opacity: 1; filter: blur(0); }
        }
        @keyframes ab-chama { from { opacity: 0; transform: translateY(26px) scale(.4); } }
        @keyframes ab-tremer { to { transform: scale(.97, 1.04) skewX(-1.5deg); } }
        @media (prefers-reduced-motion: reduce) {
            .ab-chama, .ab-v, .ab-h, .ab-letra { animation: none; }
            #abertura.saindo .ab-logo { transform: none; }
        }
    </style>
</head>
<body>
    <!-- Abertura (D51): a logo se monta peça por peça enquanto o app carrega.
         Fica fora do #app para não sumir quando a primeira tela entra. -->
    <div id="abertura" aria-hidden="true">
        <div class="ab-logo">
            <img class="ab-chama" src="/logo-chama.png" alt="" width="120" height="238">
            <div class="ab-cruz">
                <span class="ab-linha ab-v"></span>
                <span class="ab-linha ab-h"></span>
                <span class="ab-letra" style="--n:0">I</span>
                <span class="ab-letra" style="--n:1">E</span>
                <span class="ab-letra" style="--n:2">J</span>
                <span class="ab-letra" style="--n:3">B</span>
            </div>
        </div>
    </div>
    <script>
        // Só na abertura "de verdade" do app: recarregar ou voltar não repete
        try {
            if (sessionStorage.getItem('iejb-abriu')) document.getElementById('abertura').remove();
            else sessionStorage.setItem('iejb-abriu', '1');
        } catch (e) { /* sem sessionStorage: mostra mesmo */ }
        // Rede de segurança: se o app nem carregar, a abertura não prende ninguém
        setTimeout(function () { var a = document.getElementById('abertura'); if (a) a.remove(); }, 8000);
    </script>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <div id="app">
        <!-- Enquanto o JS carrega, mostra só o logo (evita tela branca) -->
        <div class="carregando-inicial" role="status">
            <img src="/logo-iejb-pequeno.png" alt="" width="56" height="56">
            <span class="sr-only">Carregando o IEJB Hub…</span>
        </div>
    </div>
    <noscript>
        <p class="sem-js">O IEJB Hub precisa de JavaScript ligado para funcionar.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
