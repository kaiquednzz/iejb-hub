<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>IEJB Hub</title>
    <meta name="description" content="Escalas e repertório dos ministérios da IEJB.">
    <!-- App privado: não queremos ele no Google -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#8F0D0B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="IEJB Hub">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" href="/icone-192.png">

    <style>
        /* Abertura (D51). Aqui dentro e não no CSS do app: precisa aparecer
           antes de qualquer arquivo carregar. Só transform/opacity: liso até
           em celular simples. O estado final de toda peça é "sem transform",
           ou seja, a logo original exata. */
        #abertura {
            position: fixed; inset: 0; z-index: 1000;
            display: grid; place-items: center;
            background: #8F0D0B;
            transition: opacity .55s cubic-bezier(.32,.72,0,1);
        }
        #abertura.saindo { opacity: 0; pointer-events: none; }
        .ab-logo {
            position: relative;
            width: 118px; aspect-ratio: 962 / 2474;
            transition: transform .6s cubic-bezier(.32,.72,0,1);
        }
        #abertura.saindo .ab-logo { transform: scale(1.14); }
        .ab-peca { position: absolute; height: auto; display: block; }
        /* Posição exata de cada peça (em % da logo). Aqui e não em style=""
           no HTML: a CSP do app não aceita estilo inline em atributo. */
        .ab-canto-1 { left:0.208%; top:48.989%; width:45.114%; }
        .ab-canto-2 { left:51.455%; top:48.949%; width:48.233%; }
        .ab-canto-3 { left:0.208%; top:71.059%; width:46.466%; }
        .ab-canto-4 { left:52.495%; top:70.736%; width:47.193%; }
        .ab-letra-i { left:20.79%; top:51.213%; width:16.008%; }
        .ab-letra-e { left:56.965%; top:51.091%; width:28.17%; }
        .ab-letra-j { left:15.385%; top:75.061%; width:21.414%; }
        .ab-letra-b { left:60.395%; top:75.061%; width:30.146%; }
        .ab-chama-2 { left:20.686%; top:12.652%; width:33.472%; }
        .ab-chama-3 { left:45.738%; top:25.222%; width:35.239%; }
        .ab-chama-1 { left:40.437%; top:-0.081%; width:33.576%; }

        /* 1. A cruz já está lá, parada: é a base de tudo.
           2. As letras saem de dentro da cruz: cada uma desliza do centro
              para o seu canto e fica nítida. Uma depois da outra. */
        .ab-letra { animation: ab-sair 1s cubic-bezier(.22,1,.36,1) backwards; }
        .ab-letra-i { --x: 24px;  --y: 22px;  animation-delay: .25s; }
        .ab-letra-e { --x: -24px; --y: 22px;  animation-delay: .4s; }
        .ab-letra-j { --x: 24px;  --y: -24px; animation-delay: .55s; }
        .ab-letra-b { --x: -24px; --y: -22px; animation-delay: .7s; }
        @keyframes ab-sair {
            from { opacity: 0; transform: translate(var(--x), var(--y)) scale(.55); filter: blur(5px); }
            45% { opacity: 1; }
        }

        /* 3. A chama acende: cada língua sobe de dentro da cruz */
        .ab-chama { transform-origin: 50% 100%; animation: ab-acender .85s cubic-bezier(.34,1.5,.64,1) backwards; }
        .ab-chama-2 { --r: -25deg; animation-delay: 1.05s; }
        .ab-chama-3 { --r: 25deg;  animation-delay: 1.15s; }
        .ab-chama-1 { --r: -8deg;  animation-delay: 1.25s; }
        @keyframes ab-acender { from { opacity: 0; transform: translateY(30%) rotate(var(--r)) scale(.2); } 35% { opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            .ab-peca { animation: none !important; }
            #abertura.saindo .ab-logo { transform: none; }
        }
    </style>
</head>
<body>
    <!-- Abertura (D51): a logo se monta peça por peça enquanto o app carrega.
         Fica fora do #app para não sumir quando a primeira tela entra. -->
    <div id="abertura" aria-hidden="true">
        <!-- As 11 peças recortadas da própria logo, cada uma na posição exata:
             no fim da animação elas formam a logo original, pixel por pixel -->
        <div class="ab-logo">
            <img class="ab-peca ab-canto ab-canto-1" src="/abertura/canto-1.png" alt="">
            <img class="ab-peca ab-canto ab-canto-2" src="/abertura/canto-2.png" alt="">
            <img class="ab-peca ab-canto ab-canto-3" src="/abertura/canto-3.png" alt="">
            <img class="ab-peca ab-canto ab-canto-4" src="/abertura/canto-4.png" alt="">
            <img class="ab-peca ab-letra ab-letra-i" src="/abertura/letra-i.png" alt="">
            <img class="ab-peca ab-letra ab-letra-e" src="/abertura/letra-e.png" alt="">
            <img class="ab-peca ab-letra ab-letra-j" src="/abertura/letra-j.png" alt="">
            <img class="ab-peca ab-letra ab-letra-b" src="/abertura/letra-b.png" alt="">
            <img class="ab-peca ab-chama ab-chama-2" src="/abertura/chama-2.png" alt="">
            <img class="ab-peca ab-chama ab-chama-3" src="/abertura/chama-3.png" alt="">
            <img class="ab-peca ab-chama ab-chama-1" src="/abertura/chama-1.png" alt="">
        </div>
    </div>
    <script>
        // Só na abertura "de verdade" do app: recarregar ou voltar não repete
        try {
            if (sessionStorage.getItem('iejb-abriu')) document.getElementById('abertura').remove();
            else sessionStorage.setItem('iejb-abriu', '1');
        } catch (e) { /* sem sessionStorage: mostra mesmo */ }
        // Rede de segurança: se o app nem carregar, a abertura não prende ninguém
        setTimeout(function () { var a = document.getElementById('abertura'); if (a) a.remove(); }, 8000);
    </script>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <div id="app">
        <!-- Enquanto o JS carrega, mostra só o logo (evita tela branca) -->
        <div class="carregando-inicial" role="status">
            <img src="/logo-iejb-pequeno.png" alt="" width="56" height="56">
            <span class="sr-only">Carregando o IEJB Hub…</span>
        </div>
    </div>
    <noscript>
        <p class="sem-js">O IEJB Hub precisa de JavaScript ligado para funcionar.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
