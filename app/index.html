<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>IEJB Hub</title>
    <meta name="description" content="Escalas e repertório dos ministérios da IEJB.">
    <!-- App privado: não queremos ele no Google -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#8F0D0B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="IEJB Hub">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" href="/icone-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
    <style>
        /* Abertura (D51). Aqui dentro e não no CSS do app: precisa aparecer
           antes de qualquer arquivo carregar. Só transform/opacity: liso até
           em celular simples. O estado final de toda peça é "sem transform",
           ou seja, a logo original exata. */
        #abertura {
            position: fixed; inset: 0; z-index: 1000;
            display: grid; place-items: center;
            background: #8F0D0B;
            transition: opacity .55s cubic-bezier(.32,.72,0,1);
        }
        #abertura.saindo { opacity: 0; pointer-events: none; }
        .ab-logo {
            position: relative;
            width: 118px; aspect-ratio: 962 / 2474;
            transition: transform .6s cubic-bezier(.32,.72,0,1);
        }
        #abertura.saindo .ab-logo { transform: scale(1.14); }
        /* Brilho que acende atrás da logo quando ela fica completa */
        .ab-logo::before {
            content: ''; position: absolute; inset: -40% -90%;
            background: radial-gradient(closest-side, rgba(255,255,255,.28), transparent);
            opacity: 0; animation: ab-brilho 1.2s 1.7s ease-out;
        }
        .ab-peca { position: absolute; height: auto; display: block; }

        /* 1. A cruz: os 4 cantos chegam girando de fora e se encaixam */
        .ab-canto { animation: ab-canto .8s cubic-bezier(.34,1.45,.64,1) backwards; }
        .ab-canto-1 { --x: -70px; --y: -70px; --r: -120deg; transform-origin: 100% 100%; animation-delay: .05s; }
        .ab-canto-2 { --x: 70px;  --y: -70px; --r: 120deg;  transform-origin: 0 100%;    animation-delay: .12s; }
        .ab-canto-3 { --x: -70px; --y: 70px;  --r: 120deg;  transform-origin: 100% 0;    animation-delay: .19s; }
        .ab-canto-4 { --x: 70px;  --y: 70px;  --r: -120deg; transform-origin: 0 0;       animation-delay: .26s; }
        @keyframes ab-canto { from { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(.4); } 25% { opacity: 1; } }

        /* 2. As letras: giram uma volta e meia e param no lugar */
        .ab-letra { animation: ab-girar 1.05s cubic-bezier(.2,.85,.25,1.12) backwards; }
        .ab-letra-i { animation-delay: .42s; }
        .ab-letra-e { animation-delay: .52s; }
        .ab-letra-j { animation-delay: .62s; }
        .ab-letra-b { animation-delay: .72s; }
        @keyframes ab-girar {
            from { opacity: 0; transform: perspective(420px) rotateY(-540deg) scale(.15); }
            20% { opacity: 1; }
        }

        /* 3. A chama acende: cada língua sobe de dentro da cruz */
        .ab-chama { transform-origin: 50% 100%; animation: ab-acender .85s cubic-bezier(.34,1.5,.64,1) backwards; }
        .ab-chama-2 { --r: -25deg; animation-delay: 1s; }
        .ab-chama-3 { --r: 25deg;  animation-delay: 1.1s; }
        .ab-chama-1 { --r: -8deg;  animation-delay: 1.2s; }
        @keyframes ab-acender { from { opacity: 0; transform: translateY(70%) rotate(var(--r)) scale(.1); } 35% { opacity: 1; } }
        @keyframes ab-brilho { 40% { opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            .ab-peca, .ab-logo::before { animation: none !important; }
            #abertura.saindo .ab-logo { transform: none; }
        }
    </style>
</head>
<body>
    <!-- Abertura (D51): a logo se monta peça por peça enquanto o app carrega.
         Fica fora do #app para não sumir quando a primeira tela entra. -->
    <div id="abertura" aria-hidden="true">
        <!-- As 11 peças recortadas da própria logo, cada uma na posição exata:
             no fim da animação elas formam a logo original, pixel por pixel -->
        <div class="ab-logo">
            <img class="ab-peca ab-canto ab-canto-1" src="/abertura/canto-1.png" alt="" style="left:0.208%;top:48.989%;width:45.114%">
            <img class="ab-peca ab-canto ab-canto-2" src="/abertura/canto-2.png" alt="" style="left:51.455%;top:48.949%;width:48.233%">
            <img class="ab-peca ab-canto ab-canto-3" src="/abertura/canto-3.png" alt="" style="left:0.208%;top:71.059%;width:46.466%">
            <img class="ab-peca ab-canto ab-canto-4" src="/abertura/canto-4.png" alt="" style="left:52.495%;top:70.736%;width:47.193%">
            <img class="ab-peca ab-letra ab-letra-i" src="/abertura/letra-i.png" alt="" style="left:20.79%;top:51.213%;width:16.008%">
            <img class="ab-peca ab-letra ab-letra-e" src="/abertura/letra-e.png" alt="" style="left:56.965%;top:51.091%;width:28.17%">
            <img class="ab-peca ab-letra ab-letra-j" src="/abertura/letra-j.png" alt="" style="left:15.385%;top:75.061%;width:21.414%">
            <img class="ab-peca ab-letra ab-letra-b" src="/abertura/letra-b.png" alt="" style="left:60.395%;top:75.061%;width:30.146%">
            <img class="ab-peca ab-chama ab-chama-2" src="/abertura/chama-2.png" alt="" style="left:20.686%;top:12.652%;width:33.472%">
            <img class="ab-peca ab-chama ab-chama-3" src="/abertura/chama-3.png" alt="" style="left:45.738%;top:25.222%;width:35.239%">
            <img class="ab-peca ab-chama ab-chama-1" src="/abertura/chama-1.png" alt="" style="left:40.437%;top:-0.081%;width:33.576%">
        </div>
    </div>
    <script>
        // Só na abertura "de verdade" do app: recarregar ou voltar não repete
        try {
            if (sessionStorage.getItem('iejb-abriu')) document.getElementById('abertura').remove();
            else sessionStorage.setItem('iejb-abriu', '1');
        } catch (e) { /* sem sessionStorage: mostra mesmo */ }
        // Rede de segurança: se o app nem carregar, a abertura não prende ninguém
        setTimeout(function () { var a = document.getElementById('abertura'); if (a) a.remove(); }, 8000);
    </script>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <div id="app">
        <!-- Enquanto o JS carrega, mostra só o logo (evita tela branca) -->
        <div class="carregando-inicial" role="status">
            <img src="/logo-iejb-pequeno.png" alt="" width="56" height="56">
            <span class="sr-only">Carregando o IEJB Hub…</span>
        </div>
    </div>
    <noscript>
        <p class="sem-js">O IEJB Hub precisa de JavaScript ligado para funcionar.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
